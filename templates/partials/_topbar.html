<header class="topbar">
  <button type="button" class="icon-btn only-mobile" id="sidebarOpen" aria-label="Ouvrir le menu" aria-controls="appSidebar" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i></button>
  <div class="topbar-actions">
    {% if acces.stock %}
    <div class="notify-wrap">
      <button type="button" class="icon-btn" id="notifyButton" aria-haspopup="true" aria-expanded="false" aria-controls="notifyPanel" aria-label="Alertes de stock : {{ nombre_alertes_stock }}">
        <i class="bi bi-bell" aria-hidden="true"></i>
        {% if nombre_alertes_stock %}<span class="count" aria-hidden="true">{{ nombre_alertes_stock }}</span>{% endif %}
      </button>
      <div class="notify-panel" id="notifyPanel" hidden>
        {% for icone, couleur, titre, texte, lien in alertes_stock %}
        <a href="{{ lien }}"><i class="bi {{ icone }}" style="color: {{ couleur }}" aria-hidden="true"></i><span><span class="who">{{ titre }}</span><span class="what">{{ texte }}</span></span></a>
        {% empty %}
        <p class="empty-inline m-1"><i class="bi bi-check-circle" aria-hidden="true"></i>Aucune alerte de stock.</p>
        {% endfor %}
      </div>
    </div>
    {% endif %}
    <div class="dropdown">
      <button type="button" class="user-btn" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar" aria-hidden="true">{{ user.nom_complet|default:user.username|slice:":1"|upper }}</span>
        <span class="user-meta"><span class="user-name">{{ user.nom_complet|default:user.username }}</span><span class="user-role">{{ roles_affiches|join:", " }}</span></span>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="dropdown-menu dropdown-menu-end">
        <a class="btn btn-outline-secondary w-100" href="{% url 'utilisateurs:password_change' %}"><i class="bi bi-key" aria-hidden="true"></i>Changer le mot de passe</a>
        <form method="post" action="{% url 'utilisateurs:deconnexion' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-danger logout-btn"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Se déconnecter</button>
        </form>
      </div>
    </div>
  </div>
</header>
