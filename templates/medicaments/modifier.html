{% extends "base.html" %}
{% block title %}Modifier {{ medicament.nom_commercial }}{% endblock %}
{% block content %}
<div class="page-head">
  <div><nav class="crumbs" aria-label="Fil d’Ariane"><ol><li><a href="{% url 'medicaments:liste' %}">Médicaments</a></li><li><a href="{% url 'medicaments:detail' medicament.pk %}">{{ medicament }}</a></li><li aria-current="page">Modifier</li></ol></nav><h1>Modifier le médicament</h1></div>
</div>
<form method="post" enctype="multipart/form-data" class="panel form-panel" novalidate>
  {% csrf_token %}
  {% include "medicaments/_form.html" with d=medicament %}
  <div class="form-actions"><a class="btn btn-outline-secondary" href="{% url 'medicaments:detail' medicament.pk %}">Annuler</a><button type="submit" class="btn btn-primary"><i class="bi bi-check2" aria-hidden="true"></i>Enregistrer</button></div>
</form>
{% endblock %}
